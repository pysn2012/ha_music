# =====================================================================
# ESP32-C3 无线音乐音箱固件 (esp32c3_player)
#
# 硬件: 自制板 "ESP32C3-插件版本" V1.2.0
#   - 主控: ESP32-C3 SuperMini (U1)
#   - 功放: MAX98357A 模块 (U4, SD 脚带 1MΩ 上拉到 VIN=5V) + 3525 扬声器 3W
#   - 灯:   2 x WS2812D-F8 (眼睛位置, 播放时律动)
#   - 其他: 振动传感器模块、震动马达模块、电池+充放电模块+电源开关
#
# 引脚 (依据原理图网表):
#   GPIO5  -> MAX98357A SD   开漏控制: 开关"开"=引脚释放(高阻), 模块 1MΩ 上拉
#                             与芯片内部 100kΩ 下拉分压 ≈0.45V = (L/2+R/2) 混合输出;
#                             开关"关"=拉低 = 功放关机。
#                             注意: 严禁推挽拉高(3.3V > 1.4V 会切到仅左声道)!
#   GPIO6  -> MAX98357A GAIN 保持悬空 = 9dB 默认增益; 拉低 = 12dB。
#                             不要拉高: 模块 VDD=5V, 3.3V=0.66×VDD 落在 3dB 档。
#   GPIO7  -> MAX98357A DIN  (I2S 数据)
#   GPIO8  -> MAX98357A BCLK
#   GPIO9  -> MAX98357A LRC
#   GPIO10 <- 振动传感器 DO  (网络名 TAP, 3.3V 供电)
#   GPIO20 -> 震动马达 IN    (网络名 MOT, 5V 供电)
#   GPIO21 -> WS2812 灯链数据 (注意: 网表里这个网络叫 "DIN", 不是 I2S 数据线!)
#   GPIO0-4 空置
#
# 交互设计:
#   - 待机/暂停时敲一下机身 -> 马达短震确认 + 开始播放;
#     播放状态自动忽略敲击(同时避免了喇叭低频和马达自震的误触发), 暂停用 HA 控制。
#   - 播放时眼睛灯随机节拍律动, 暂停/停止熄灭。
#
# 注意: C3 的 UART0 默认占用 GPIO20/GPIO21, 与本板的马达/灯冲突,
#       因此 logger 必须走 USB_SERIAL_JTAG (已在下方配置, 勿删)。
# =====================================================================

esphome:
  name: music-player
  friendly_name: music player
  min_version: 2025.12.0

esp32:
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf          # media_player 的 speaker 平台仅支持 ESP-IDF
    sdkconfig_options:
      # 本板为 ESP32-C3FH4: XMC 家嵌入式 flash(flash_id 厂商 0x46) + rev0.4 步进。
      # XMC flash 在部分 IDF 版本上有读取稳定性/挂起兼容问题, 会波及存放在
      # NVS 里的 RF 校准数据(读坏 -> 扫描变聋)。两条通用稳定性 workaround:
      CONFIG_ESPTOOLPY_FLASHFREQ: "40m"    # flash 时钟 80M -> 40M (XMC 最常用解法)
      CONFIG_ESPTOOLPY_FLASHFREQ_40M: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "n"
      CONFIG_SPI_FLASH_SUSPEND: "n"        # 关闭 flash 自动挂起(XMC 挂起/恢复有 errata)

logger:
  hardware_uart: USB_SERIAL_JTAG   # 走板载 USB-C, 避开 GPIO20/21

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # 流媒体播放稳定性优先, 略增功耗
  # 供电弱的板子把 TX 功率压到 8.5dBm(允许的最低值): 满功率 TX 电流尖峰
  # ~330mA 会拉垮 3.3V 轨, MPY 实测本板 8.5dBm 下 10/10 稳定。
  # 注意: 该参数必须用 2025.12 编译(运行时 API)——2026.9 改成了编译期
  # PHY 参数且其新 WiFi 状态机与本板(ESP32-C3 rev0.4)组合存在认证挂死问题,
  # 详见 README 的 WiFi 排障章节。
  output_power: 8.5dBm
  # 不配置 fallback AP(热点)。依据: QBIT#29 等案例表明 C3 单射频上 AP 与 STA
  # 共存/切换会干扰 STA 连接; 且重试风暴期间热点因信道跳变基本搜不到,
  # 本项目凭据在 CI 里烧死、刷机走 USB, 配网兜底无实际用途。
  # 如需恢复, 加回以下两段并同步恢复 captive_portal::
  #   ap:
  #     ssid: "music-player"
  #     password: "12345678"

# captive_portal 已移除: 它依赖 fallback AP, 本固件不再配置热点(见 wifi 块注释)。

# ---------------- I2S 音频 ----------------
i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin: GPIO8
    i2s_lrclk_pin: GPIO9

speaker:
  # 真实硬件扬声器 (I2S 输出)
  - platform: i2s_audio
    id: amp_speaker
    dac_type: external
    i2s_dout_pin: GPIO7
    sample_rate: 44100
    bits_per_sample: 16bit
    # mono = 同一份单声道数据写入两个 I2S 槽位, 功放混合模式输出 (槽L+槽R)/2 = 原始信号。
    # 两条流水线都用 num_channels: 1, 左右声道由 HA 转码时混合, 内容无损、流带宽还减半。
    channel: mono
    buffer_duration: 100ms
  # 混音器: announcement 与 media 两条流水线不允许共用同一个真实扬声器(编译期强制),
  # 各占一个 mixer 源, 由混音器汇入上面的硬件扬声器; 还能做 TTS 压低音乐的 ducking
  # (id 不能取 mixer_speaker: 会与组件的 C++ 命名空间 esphome::mixer_speaker 撞名,
  #  生成的代码报 ambiguous, 换任何别的名字都行)
  - platform: mixer
    id: audio_mixer
    output_speaker: amp_speaker
    source_speakers:
      - id: announcement_source
      - id: media_source

media_player:
  - platform: speaker
    id: speaker_music_player
    name: speaker_music_player
    # 音量钳制(参考 S3-BOX-3 官方示例的做法): HA 音量条只在 50%~80% 间移动,
    # 保护 3W 小喇叭; 想更响走 GAIN 12dB 档或调高 volume_max
    volume_min: 0.5
    volume_max: 0.8
    # C3 无 PSRAM, 默认 1MB 缓冲装不下; 每条流水线各占一份。
    # 内存不足/重启 -> 降到 49152; 音乐卡顿 -> 升到 98304。
    buffer_size: 65536
    announcement_pipeline:           # TTS/通知 (HA 自动转码成 WAV)
      speaker: announcement_source
      format: WAV
      # mixer 的两个源要混音就必须同采样率, 统一 44100
      sample_rate: 44100
      num_channels: 1
    media_pipeline:                  # 音乐 (HA 自动转码成 MP3, 需 HA 2024.10+)
      speaker: media_source
      format: MP3
      sample_rate: 44100
      num_channels: 1
    # 播放状态联动眼睛灯: 播放 -> 律动, 暂停/停止 -> 熄灭
    on_play:
      - light.turn_on:
          id: status_leds
          brightness: 100%
          effect: Music Pulse
    on_pause:
      - light.turn_off:
          id: status_leds
    on_idle:
      - light.turn_off:
          id: status_leds

# ---------------- 功放使能 (SD, 开漏控制) ----------------
# 开漏输出: 开关开 -> 引脚释放(高阻), 模块 1MΩ 上拉把 SD 分压到 ~0.45V = 混合输出;
#           开关关 -> 拉低 SD = 功放关机。绝不能推挽拉高(=仅左声道)。
output:
  - platform: gpio
    id: amp_sd
    pin:
      number: GPIO5
      mode: OUTPUT_OPEN_DRAIN
  - platform: gpio
    id: motor_out
    pin: GPIO20

switch:
  - platform: output
    output: amp_sd
    id: amp_enable
    name: Amp Enable
    restore_mode: ALWAYS_ON
  # GPIO6 (GAIN) 默认悬空 = 9dB。想手动加一档音量就启用下面这段:
  # 开(高阻)=9dB, 关(拉低)=12dB。切勿拉高(5V 模块上 3.3V ≈ 3dB 档)。
  # - platform: gpio
  #   pin:
  #     number: GPIO6
  #     mode: OUTPUT_OPEN_DRAIN
  #   id: amp_gain
  #   name: Amp Gain Boost
  #   restore_mode: ALWAYS_ON
  - platform: output
    output: motor_out
    id: motor_switch
    name: Vibration Motor
    restore_mode: ALWAYS_OFF

# ---------------- 眼睛灯 (2 x WS2812) ----------------
light:
  - platform: esp32_rmt_led_strip
    id: status_leds
    name: Eye LEDs
    pin: GPIO21
    num_leds: 2
    chipset: ws2812
    rgb_order: GRB
    is_rgbw: false
    restore_mode: ALWAYS_OFF
    effects:
      # 播放时的随机律动: 内置 random 效果(与 eetree_ai 的"语音律动"同款),
      # 每 120ms 随机跳到新亮度并做 150ms 过渡, 全程无自定义 C++ 代码,
      # ESPHome 版本升级也不会导致编译失败。嫌闪得太快可调大 update_interval。
      - random:
          name: Music Pulse
          transition_length: 150ms
          update_interval: 120ms

# ---------------- 振动传感器 (敲击开机) ----------------
# 待机/暂停状态敲一下 -> 马达短震确认 + 开始播放;
# 播放状态整体忽略敲击(不用再单独防喇叭低频/马达自震的误触发)。
# 模块上的灵敏度电位器如调得太高, 待机时也可能误触发, 适当调低即可。
binary_sensor:
  - platform: gpio
    id: vibration
    name: Vibration Sensor
    device_class: vibration
    pin:
      number: GPIO10
      mode: INPUT
      inverted: false   # 若你的模块是有振动输出低电平, 改成 true
    filters:
      - delayed_on: 20ms
      - delayed_off: 150ms
    on_multi_click:
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.45s
        then:
          - if:
              condition:
                not:
                  media_player.is_playing: speaker_music_player
              then:
                - switch.turn_on: motor_switch
                - delay: 120ms
                - switch.turn_off: motor_switch
                - media_player.toggle: speaker_music_player

# ---------------- 辅助功能 ----------------
sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: WiFi Signal
    update_interval: 60s

button:
  - platform: restart
    id: restart_btn
    name: Restart

interval:
  # WiFi 兜底: 长时间连不上就整机重启, 重置重试节奏, 不在退避状态里干耗。
  # 连接正常时永不触发, 不影响播放。
  - interval: 10min
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log: "WiFi 10min not connected, restarting"
            - button.press: restart_btn

# ---------------- 定时播放闹钟 (5 组, 时间在 HA 设备页面设置) ----------------
# 需要 SNTP 对时; 设备在 HA 里暴露 Alarm 1~5 五个时间实体(设备页面上的时间选择器),
# 存在设备上、断电保留。到点后固件执行: 马达短震回执 → 音量 60% →
# 指挥 HA 播放 /media/music/morning.mp3 (歌曲可随时在 HA 里换)。
# 说明:
#   - 新烧录后闹钟是"未知"状态, 在 HA 设备页面设置时间后才生效;
#   - 时间设成 00:00:00 = 该组停用(有守卫, 不会在零点误触发);
#   - 改时间/停用都在 HA 页面, 不用重编; 换铃声改对应组的
#     media_content_id、增减组数才需要重编。
time:
  - platform: sntp
    id: ntp_time
    timezone: Asia/Shanghai
    servers:
      - ntp.aliyun.com
      - 0.pool.ntp.org

datetime:
  - platform: template
    id: alarm_1
    name: "Alarm 1"
    type: time
    optimistic: true
    restore_value: true
    on_time:
      then:
        - if:
            condition:
              lambda: 'return id(alarm_1).hour != 0 || id(alarm_1).minute != 0;'
            then:
              - switch.turn_on: motor_switch
              - delay: 120ms
              - switch.turn_off: motor_switch
              - homeassistant.service:
                  service: media_player.volume_set
                  data:
                    entity_id: media_player.speaker_music_player
                    volume_level: "0.6"
              - homeassistant.service:
                  service: media_player.play_media
                  data:
                    entity_id: media_player.speaker_music_player
                    media_content_id: media-source://media_source/local/music/morning.mp3
                    media_content_type: music
  - platform: template
    id: alarm_2
    name: "Alarm 2"
    type: time
    optimistic: true
    restore_value: true
    on_time:
      then:
        - if:
            condition:
              lambda: 'return id(alarm_2).hour != 0 || id(alarm_2).minute != 0;'
            then:
              - switch.turn_on: motor_switch
              - delay: 120ms
              - switch.turn_off: motor_switch
              - homeassistant.service:
                  service: media_player.volume_set
                  data:
                    entity_id: media_player.speaker_music_player
                    volume_level: "0.6"
              - homeassistant.service:
                  service: media_player.play_media
                  data:
                    entity_id: media_player.speaker_music_player
                    media_content_id: media-source://media_source/local/music/morning.mp3
                    media_content_type: music
  - platform: template
    id: alarm_3
    name: "Alarm 3"
    type: time
    optimistic: true
    restore_value: true
    on_time:
      then:
        - if:
            condition:
              lambda: 'return id(alarm_3).hour != 0 || id(alarm_3).minute != 0;'
            then:
              - switch.turn_on: motor_switch
              - delay: 120ms
              - switch.turn_off: motor_switch
              - homeassistant.service:
                  service: media_player.volume_set
                  data:
                    entity_id: media_player.speaker_music_player
                    volume_level: "0.6"
              - homeassistant.service:
                  service: media_player.play_media
                  data:
                    entity_id: media_player.speaker_music_player
                    media_content_id: media-source://media_source/local/music/morning.mp3
                    media_content_type: music
  - platform: template
    id: alarm_4
    name: "Alarm 4"
    type: time
    optimistic: true
    restore_value: true
    on_time:
      then:
        - if:
            condition:
              lambda: 'return id(alarm_4).hour != 0 || id(alarm_4).minute != 0;'
            then:
              - switch.turn_on: motor_switch
              - delay: 120ms
              - switch.turn_off: motor_switch
              - homeassistant.service:
                  service: media_player.volume_set
                  data:
                    entity_id: media_player.speaker_music_player
                    volume_level: "0.6"
              - homeassistant.service:
                  service: media_player.play_media
                  data:
                    entity_id: media_player.speaker_music_player
                    media_content_id: media-source://media_source/local/music/morning.mp3
                    media_content_type: music
  - platform: template
    id: alarm_5
    name: "Alarm 5"
    type: time
    optimistic: true
    restore_value: true
    on_time:
      then:
        - if:
            condition:
              lambda: 'return id(alarm_5).hour != 0 || id(alarm_5).minute != 0;'
            then:
              - switch.turn_on: motor_switch
              - delay: 120ms
              - switch.turn_off: motor_switch
